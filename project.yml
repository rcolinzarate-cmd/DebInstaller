name: DebInstaller
options:
  bundleIdPrefix: com.rcolinzarate
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: es
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.rcolinzarate.debinstaller
    SWIFT_OBJC_BRIDGING_HEADER: DebInstaller/DebInstaller-Bridging-Header.h
    CLANG_ENABLE_MODULES: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: NO
    # CRÍTICO: fuerza a Xcode a usar NUESTRO Info.plist, no auto-generar uno
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: DebInstaller/Info.plist

targets:
  DebInstaller:
    type: application
    platform: iOS
    sources:
      - path: DebInstaller
        excludes:
          - Info.plist
          - "**/*.entitlements"
          - "embedded/*.deb"
      # Agregar el .deb EXPLÍCITAMENTE como resource (xcodegen puede ignorar carpetas opcionales)
      - path: DebInstaller/embedded/siseos.deb
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rcolinzarate.debinstaller
      PRODUCT_NAME: DebInstaller
    frameworks:
      - UIKit
      - UniformTypeIdentifiers
